[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headai"
version = "0.1.0"
description = "AI Assistant with multi-provider support"
authors = [
    {name = "Head AI Team", email = "team@headai.com"}
]
dependencies = [
    "customtkinter>=5.2.0",
    "selenium>=4.11.2",
    "webdriver-manager>=4.0.0",
    "transformers>=4.35.0",
    "torch>=2.1.1",
    "cohere>=4.32",
    "anthropic>=0.5.0",
    "python-dotenv>=1.0.0",
    "nltk>=3.8.1"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.1",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "system: System tests",
    "performance: Performance tests",
    "ui: UI tests",
    "network: Tests that require network access",
    "voice: Tests that require voice input/output",
    "gpu: Tests that require GPU",
    "memory: Tests that monitor memory usage",
    "slow: Tests that take longer than 1 second",
    "quick: Tests that complete quickly"
]
