name: Test and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r testing/requirements.txt
        pip install pytest-cov coverage-badge
        
    - name: Check for dependency conflicts
      run: |
        python testing/utils/dependency_monitor.py
        
    - name: Run tests with coverage
      run: |
        pytest testing/tests --cov=. --cov-report=xml --cov-report=html
        
    - name: Generate coverage badge
      run: |
        coverage-badge -o coverage.svg -f
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          htmlcov/
          coverage.xml
          coverage.svg
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: true

  deploy-staging:
    needs: test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install deployment dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r testing/requirements.txt
        
    - name: Deploy to staging
      run: |
        # Add your staging deployment commands here
        echo "Deploying to staging environment"
        
    - name: Run integration tests in staging
      run: |
        pytest testing/tests/integration -v
        
  deploy-production:
    needs: [test, deploy-staging]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install deployment dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r testing/requirements.txt
        
    - name: Deploy to production
      run: |
        # Add your production deployment commands here
        echo "Deploying to production environment"
        
    - name: Run smoke tests
      run: |
        pytest testing/tests/e2e -m smoke -v
